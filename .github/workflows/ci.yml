name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint & Typecheck
    # Windows, because file_assoc uses winreg and hwnd_diag uses ctypes.windll.
    # A Linux typecheck of those modules reports errors about a platform the
    # app does not target, and misses nothing in return.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra qt

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy typecheck
        run: uv run mypy craftgraph/

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # PySide6 is a hard runtime dependency, so pytest-qt imports QtGui at
      # collection time. The ubuntu runner image ships none of the GL/EGL/xkb
      # libraries that import needs, and has no display either.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: uv sync --extra qt

      # Windows is the shipped platform, so it runs everything, slow Qt
      # stress modules included.
      - name: Run tests (Windows, full suite)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

      # Linux and macOS skip the slow-marked Qt modules. Driving the full
      # node editor through an offscreen QPA segfaults the interpreter there
      # (exit 139 in test_qt_gui), which says more about headless Qt on a
      # runner than about the code. The rest of the suite still runs, so
      # parser, graph, serializer and model coverage stays cross-platform.
      - name: Run tests (non-Qt suite)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v -m "not slow"

  smoke-no-dev:
    name: Smoke (--no-dev runtime deps only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync runtime deps only
        run: uv sync --no-dev

      - name: Smoke parse the committed fixture mod
        run: uv run --no-dev python -c "from pathlib import Path; from craftgraph.parser import parse_directory; parse_directory(Path('tests/fixtures/mini_mod')); print('smoke ok')"

  build:
    name: Build (${{ matrix.os }})
    needs: [quality, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: craftgraph
          - os: windows-latest
            artifact: craftgraph.exe
          - os: macos-latest
            artifact: craftgraph
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra qt

      - name: Build binary
        run: uv run pyinstaller --onefile --name craftgraph --collect-data pyvis craftgraph/cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: craftgraph-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
