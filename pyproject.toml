[project]
name = "craftgraph"
version = "0.1.0-alpha.1"
description = "CraftGraph - A Node based Editor for CustomCraft3 (and CustomBatteries)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click==8.4.1",
    "msgpack>=1.0",
    "msgspec>=0.21.1",
    "networkx>=3.0",
    "platformdirs==4.9.6",
    "psutil>=7.2.2",
    "pyside6==6.11.1",
    "watchdog>=4.0",
]
# Note on duplicates: ``hypothesis`` is intentionally dev-only; it is a
# property-testing library used by ``tests/test_parser_roundtrip_property.py``
# and nothing in the runtime tree imports it. ``pyside6`` is a hard runtime
# dep above, so the ``[qt]`` extra below only declares ``nodegraphqt`` (no
# need to redeclare pyside6). ``pyvis`` / ``rich`` are runtime-optional via
# the ``[visualizer]`` and ``[pretty]`` extras and additionally pinned in
# ``dev`` so a developer ``uv sync`` always installs them.

[project.optional-dependencies]
qt = [
    "nodegraphqt>=0.6.44",
]
# Pulls pyvis in for the CLI ``view`` / ``watch`` commands. Bundled GUI
# binary never invokes these so it does not need pyvis. Install with
# ``pip install "craftgraph[visualizer]"``.
visualizer = [
    "pyvis>=0.3",
]
# Pulls rich in for prettier console logs + tracebacks. Optional so a
# minimal release install (`uv sync --no-dev`) still ships without it;
# ``log_setup`` falls back to stdlib ``StreamHandler`` when rich is
# missing.
pretty = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    # Type checkers + linters
    "mypy>=2.1.0",
    "ruff>=0.15.14",
    "types-networkx>=3.6.1.20260518",
    # Optional UX deps used at runtime when present; kept in dev so the
    # dev experience stays unchanged. Release builds get them via the
    # ``visualizer`` / ``pretty`` optional-dep groups instead.
    "pyvis>=0.3",
    "rich>=15.0.0",
    # Build / packaging
    "pyinstaller>=6.20.0",
    # Test suite + plugins
    "pytest>=9.0.3",
    "pytest-sugar>=1.1.1",
    "pytest-clarity>=1.0.1",
    "pytest-qt>=4.5.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.152.9",
]

[project.scripts]
craftgraph = "craftgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet third-party deprecation noise we cannot fix here. See:
# https://docs.pytest.org/en/stable/how-to/capture-warnings.html
# - distutils LooseVersion: NodeGraphQt internal use, removed in Python 3.12+
# - QMouseEvent positional args: PySide6 API moved to QPointF-only constructors
# Our own deprecations stay visible so we catch them in CI.
filterwarnings = [
    "ignore:distutils Version classes are deprecated.*:DeprecationWarning",
    "ignore:.*QMouseEvent.*marked as deprecated.*:DeprecationWarning",
]
markers = [
    "slow: marks tests that take meaningful time (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["craftgraph"]
branch = true
omit = [
    "craftgraph/__main__.py",
    "craftgraph/cc3_reference_files/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["pyvis", "pyvis.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["msgpack", "msgpack.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["craftgraph.project", "tests.test_project"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "craftgraph.visualizer"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["NodeGraphQt", "NodeGraphQt.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["craftgraph.qt_nodes", "craftgraph.qt_gui", "craftgraph.welcome", "craftgraph.minimap"]
disallow_untyped_calls = false
