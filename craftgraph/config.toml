# CraftGraph build/runtime defaults.
#
# This file ships inside the `craftgraph` package. Values here are the
# compiled-in defaults used at every launch. They are loaded once on first
# access via `craftgraph.config.get_config()` (stdlib `tomllib`, no write
# dependency).
#
# User-overridable runtime preferences (per-user tweaks, window state, etc.)
# live in `settings.json` under the platform config directory. Do not
# confuse the two: this file = app defaults; settings.json = user overrides.

[paths]
# Package-relative directory containing platform icon files (.ico/.icns/.png).
icons_subdir = "data/icons"
# Package-relative directory containing static data files (TechType lists etc.).
data_subdir = "data"
# Per-project layout cache directory name (created next to project files).
layout_dir_name = ".craftgraph"
# Per-project layout cache filename.
layout_filename = "layout.json"
# Subpath segments walked from a Steam install root to reach the CC3 plugin.
cc3_install_segments = ["steamapps", "common", "Subnautica", "BepInEx", "plugins", "CustomCraft3"]
# Default Steam library root candidates (Windows). Probed in order on first run.
steam_root_candidates = [
    "C:/SteamLibrary",
    "C:/Program Files (x86)/Steam",
    "D:/SteamLibrary",
    "D:/Program Files (x86)/Steam",
]

[timings]
# Programmatic file-watcher debounce in seconds (CLI watcher).
watcher_debounce_sec = 0.3
# Minimap repaint interval in milliseconds.
minimap_update_interval_ms = 100
# Code-editor parse debounce default in milliseconds (user-overridable).
parse_debounce_ms_default = 400
# GUI file-watcher debounce default in milliseconds (user-overridable).
file_watcher_debounce_ms_default = 300

[app]
# Stable application identifiers. Changing any of these post-release breaks
# existing file associations and NodeGraphQt type registrations. Do not edit
# after first release.
identifier = "com.craftgraph"
file_ext = ".craftgraph"
prog_id = "CraftGraph.Project"
mime_type = "application/x-craftgraph"
file_description = "CraftGraph Project"

[ui]
# Node sprite thumbnail edge length in pixels (square).
sprite_size = 64

[ui.theme]
# Code editor default font. Baseline that ship defaults pull from; users can
# still override via settings.json (CodeEditorSettings.font_family/size).
default_font_family = "Consolas"
default_font_size = 10

[ui.variable_nodes]
# Maximum width (px) of the "Ref" combo box on variable/getter nodes.
ref_combo_max_w = 160
# Stylesheet fragments applied to required-field widgets on recipe nodes.
# Red border when empty, no border when filled.
required_empty_style = "border: 1px solid rgb(200, 60, 60);"
required_valid_style = "border: none;"

[ui.colors.nodes]
# Title-bar tint (RGB 0-255) for each block type plus the two pseudo-types
# (orphan ingredient, sprite helper). Values mirror qt_nodes.py defaults.
modified_recipe = [60, 120, 80]
added_recipe = [60, 140, 80]
alias_recipe = [80, 120, 120]
custom_food = [120, 100, 60]
fabricator = [80, 80, 160]
crafting_tab = [160, 120, 40]
custom_size = [100, 100, 100]
moved_recipe = [120, 80, 120]
custom_bio_fuel = [140, 100, 40]
custom_fragment_count = [80, 100, 140]
orphan_ingredient = [90, 90, 90]
sprite = [180, 160, 60]

[ui.colors.ports]
# Pin-color palette (RGB 0-255). One tuple per semantic port role.
hierarchy = [200, 200, 100]
output = [100, 200, 100]
ingredient = [180, 80, 0]
children = [100, 100, 220]
sprite = [180, 160, 60]
variable = [100, 70, 130]

[ui.layout]
# Node editor column X positions + vertical step for the file-load layout.
# Used by sync.py when placing nodes from a freshly loaded ParsedFile.
y_step = 150.0
x_fab = -400.0
x_tab = -100.0
x_recipe = 250.0
# Hierarchy-aware layout (DFS tree). Child tabs nest to the right of their
# parent and advance Y within each subtree.
layout_y_step = 120.0
layout_y_group_gap = 80.0
# Horizontal step per nesting level. Derived as x_recipe - x_tab in sync.py;
# declared here only for completeness/override. Keep consistent if edited.
layout_x_child_offset = 350.0

[ui.minimap]
# Widget dimensions in pixels.
width = 220
height = 160
# All colors are [R, G, B, A] integers in 0-255. A defaults to 255 for the
# opaque entries where only 3 values are given.
bg_color = [25, 25, 30, 220]
border_color = [80, 80, 80, 255]
node_color = [100, 140, 180, 255]
viewport_fill = [255, 255, 255, 25]
viewport_border = [200, 200, 200, 160]

[visualizer]
# Pyvis HTML rendering tunables.
base_node_size = 10
size_scale = 3
normal_edge_color = "#888888"
cycle_edge_color = "#e74c3c"
normal_edge_width = 1
cycle_edge_width = 3

[limits]
# Default cap on the recent-files list (user-overridable).
recent_files_default_max = 10
# CC3 ingredient "Required" field valid range (inclusive).
ingredient_required_min = 1
ingredient_required_max = 25
